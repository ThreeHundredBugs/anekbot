name: anekbot Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

defaults:
  run:
    working-directory: src/anekbot-go

jobs:
  build:
    name: Build ${{matrix.goos}}/${{matrix.goarch}}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/anekbot-go/go.mod
          cache-dependency-path: src/anekbot-go/go.sum

      - name: Build
        env:
          GOOS: ${{matrix.goos}}
          GOARCH: ${{matrix.goarch}}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/anekbot ./cmd/anekbot

      - name: Package
        run: |
          archive="anekbot-${{matrix.goos}}-${{matrix.goarch}}.tar.gz"
          tar -C dist -czf "$archive" anekbot
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: anekbot-${{matrix.goos}}-${{matrix.goarch}}
          path: |
            src/anekbot-go/anekbot-${{matrix.goos}}-${{matrix.goarch}}.tar.gz
            src/anekbot-go/anekbot-${{matrix.goos}}-${{matrix.goarch}}.tar.gz.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
